name: Descomprimir proyecto

on:
  push:
    paths:
      - "para-ella-apple-experience.zip"
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Descomprimir
        run: |
          unzip -o para-ella-apple-experience.zip -d .
          rm para-ella-apple-experience.zip

      - name: Commit del contenido descomprimido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Descomprimir proyecto"
          git push
